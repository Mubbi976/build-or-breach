[project]
name = "build-or-breach"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0,<4.0",
    "Flask-SQLAlchemy>=3.1,<4.0",
    "Flask-Login>=0.6,<1.0",
    "Flask-WTF>=1.2,<2.0",
    "Flask-Limiter>=3.8,<5.0",
    "openai>=1.68,<3.0",
    "python-dotenv>=1.0,<2.0",
    "psycopg2-binary>=2.9.9,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[tool.vercel]
entrypoint = "run:app"
